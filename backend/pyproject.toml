[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claimops-backend"
version = "0.1.0"
description = "ClaimOps Intelligence Python API and domain services"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.85,<1.44",
  "fastapi>=0.135.3,<0.136",
  "pydantic>=2.13.4,<3",
  "uvicorn[standard]>=0.38.0,<0.39",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=9.0.3,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["claimops*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
addopts = "-ra"
